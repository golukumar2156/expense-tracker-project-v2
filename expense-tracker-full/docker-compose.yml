services:
  mysql:
    image: mysql:8.4
    container_name: expense-tracker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expense_tracker
    ports:
      - "3306:3306"
    volumes:
      - expense_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    container_name: expense-tracker-api
    environment:
      DB_URL: jdbc:mysql://mysql:3306/expense_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: local-docker-secret-change-this-to-a-long-random-secret-123456789
      CORS_ALLOWED_ORIGIN: http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: expense-tracker-frontend
    ports:
      - "5500:80"
    depends_on:
      - backend
volumes:
  expense_mysql_data:
